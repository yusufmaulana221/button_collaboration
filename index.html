<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Teman</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: #1e293b;
            padding: 40px 30px;
            border-radius: 20px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #1d4ed8;
            transform: translateY(-3px);
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Website Teman Saya</h1>

        <p>
            Selamat datang! Klik tombol di bawah
            untuk mengunjungi website teman saya.
        </p>

        <a
            href="https://contoh-website-teman.com"
            target="_blank"
            rel="noopener noreferrer"
            class="btn"
        >
            Kunjungi Website
        </a>

        <footer>
            Dibuat menggunakan HTML, CSS, dan JavaScript
        </footer>
    </div>

</body>
</html>
